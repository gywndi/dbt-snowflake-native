# Snowflake CLI로 dbt 프로젝트를 Snowflake 안에 배포하고 실행한다.
# dbt/ 아래 파일이나 이 파일이 바뀐 main 푸시에서만 자동으로 돈다. 그 외에는 수동 실행 버튼만 보인다.
# Snowflake 접속 비밀번호는 CI 변수 SNOWFLAKE_PASSWORD(Masked)로 받고, CLI가 환경변수로 읽는다.

image: python:3.12-slim

stages:
  - deploy

variables:
  # snow 명령의 임시 연결 옵션 (설정 파일 없이 플래그로 연결한다)
  SNOW_CONN: "--temporary-connection --account <org>-<account> --user SVC_DBT --role DBT_APP --warehouse DBT_WH --database DBT_DEV --schema NATIVE"

# MR 파이프라인은 만들지 않는다. 프로젝트 객체가 하나라서 MR 코드를 배포하면 live 버전이 덮어써진다
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

snowflake_native:
  stage: deploy
  # 같은 객체에 배포가 겹치지 않게 한 번에 하나만 돈다
  resource_group: snowflake_native
  timeout: 15m
  rules:
    # 배포 대상 파일이 바뀐 경우에만 자동 실행한다
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - dbt/**/*
        - .gitlab-ci.yml
    # 그 외 main 푸시에서는 필요할 때 손으로 실행한다
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - pip install --quiet snowflake-cli
    # 체크아웃된 GitLab 코드 중 dbt/ 디렉토리만 올린다. 어느 커밋이 배포됐는지 객체에 남긴다
    - snow dbt deploy snowflake_dbt_native --source dbt --profiles-dir dbt --default-target dev --git-commit "$CI_COMMIT_SHA" --git-branch "$CI_COMMIT_REF_NAME" $SNOW_CONN
    # 연결 옵션은 dbt 명령(build)보다 앞에 둔다. 뒤의 인자는 전부 dbt로 넘어간다
    - snow dbt execute $SNOW_CONN snowflake_dbt_native build
